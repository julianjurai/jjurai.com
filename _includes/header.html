<div class="wrapper-masthead">
  <div class="container">
    <header class="masthead clearfix">
      <div class="site-info">
        <h1 class="site-name">
          <a href="{{ site.baseurl }}/">{{ site.name }}</a>
        </h1>
      </div>
      <div id="navBlock" role="navigation">
        <nav>
          <ul>
            <li {% if page.url=="/" %} class="current" {% endif %}>
              <a href="{{ site.baseurl }}/">About</a>
            </li>
            <li {% if page.url=="/blog/" %} class="current" {% endif %}>
              <a href="{{ site.baseurl }}/blog/">Blog</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
  </div>
</div>
